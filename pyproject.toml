[project]
name = "fabric-deploy"
version = "0.1.2"
description = "CLI tool for Microsoft Fabric workspace deployments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fabric-cicd>=0.1.29",
    "pyyaml",
]

[project.scripts]
fabdep = "fabric_deploy.cli:main"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.basedpyright]
include = ["src"]
reportMissingImports = "error"
reportAny = false
reportImplicitOverride = false
reportImplicitStringConcatenation = false
reportMissingTypeStubs = false
reportUnknownVariableType = false
