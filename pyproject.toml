[project]
name = "fabric-deploy"
version = "0.2.3"
description = "CLI tool for Microsoft Fabric workspace deployments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fabric-cicd>=0.2.0",
    "pytest>=7.0.0",
    "pyyaml",
]

[project.scripts]
fabdep = "fabric_deploy.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "-s",
    "--strict-markers",
    "--tb=short",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.basedpyright]
include = ["src"]
reportMissingImports = "error"
reportAny = false
reportImplicitStringConcatenation = false
reportMissingTypeStubs = false
