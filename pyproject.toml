[project]
name = "fabric-deploy"
version = "1.8.0"
description = "CLI tool for Microsoft Fabric workspace deployments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.25.3",
    "fabric-cicd>=1.3",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
fabdep = "fabric_deploy.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "-s",
    "--strict-markers",
    "--tb=short",
    "-m",
    "not integration",
]
markers = [
    "integration: requires live Fabric API + az login (run with `pytest -m integration`)",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.basedpyright]
include = ["src"]
reportMissingImports = "error"
reportAny = false
reportImplicitStringConcatenation = false
reportMissingTypeStubs = false
