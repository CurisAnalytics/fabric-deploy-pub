[project]
name = "fabric-deploy-cli"
version = "0.1.0"
description = "CLI tool for Microsoft Fabric workspace deployments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fabric-cicd>=0.1.29",
    "pyyaml",
]

[project.scripts]
fabdep = "fabric_deploy.cli:main"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.basedpyright]
include = ["src"]
reportMissingImports = "error"
reportMissingTypeStubs = false
reportImplicitStringConcatenation = false
reportAny = false
reportUnknownVariableType = false
